name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for test repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Static checks (skills, tokens, JSON, config, no hardcoded remotes)
        run: python tools/check_repo.py
      - name: Compile
        run: python -m compileall -q core install.py tools
      - name: Unit and end-to-end tests (install, apply, brownfield, zip, ticket lifecycle)
        run: python -m unittest discover -s tests/unit -t tests/unit -v
